name: Build macOS (AU + VST3)

on:
  push:
    branches: [polyrhythm32]
    tags: ['polyrhythm32-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (Universal, Apple Silicon + Intel)"
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --target PolyRhythm32_AU PolyRhythm32_VST3 PolyRhythm32_Standalone -j 4

      - name: Package
        run: bash scripts/package_mac.sh

      - name: Validate Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/PolyRhythm32/PolyRhythm32.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Pr32 Dkrb

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyRhythm32-macOS
          path: dist/PolyRhythm32-macOS.zip

      - name: Publish release
        if: github.ref == 'refs/heads/polyrhythm32' || startsWith(github.ref, 'refs/tags/polyrhythm32-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="polyrhythm32-v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/PolyRhythm32-macOS.zip --clobber
          else
            gh release create "$TAG" dist/PolyRhythm32-macOS.zip --target "$GITHUB_SHA" \
              --title "PolyRhythm32 v1.0.0 (macOS AU + VST3)" --notes-file scripts/RELEASE_NOTES.md
          fi
