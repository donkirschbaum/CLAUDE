name: Build macOS (AU + VST3)

on:
  push:
    branches: [grids8]
    tags: ['grids8-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Universal: Apple Silicon + Intel)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --target Grids8_AU Grids8_VST3 Grids8_Standalone -j 4

      - name: Package
        run: bash scripts/package_mac.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grids8-macOS
          path: dist/Grids8-macOS.zip

      - name: Publish release (tags grids8-v*)
        if: startsWith(github.ref, 'refs/tags/grids8-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Grids8-macOS.zip \
            --title "Grids 8 $GITHUB_REF_NAME" --notes-file scripts/RELEASE_NOTES.md \
          || gh release upload "$GITHUB_REF_NAME" dist/Grids8-macOS.zip --clobber
