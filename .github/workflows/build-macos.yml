name: Build macOS (AU + VST3)

on:
  push:
    paths-ignore:
      - 'Volta4/**'
      - '.github/workflows/build-volta4.yml'
      - 'Octo8/**'
      - '.github/workflows/build-octo8.yml'
      - 'Fundstück iPhone/**'
      - '.github/workflows/build-fundstueck-iphone.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal arm64 + x86_64)"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package (ad-hoc signed)
        run: |
          A="build/ShruthiXT_artefacts/Release"
          mkdir -p dist
          cp -R "$A/AU/Shruthi XT.component" dist/
          cp -R "$A/VST3/Shruthi XT.vst3" dist/
          cp -R "$A/Standalone/Shruthi XT.app" dist/
          codesign --force --deep -s - "dist/Shruthi XT.component" "dist/Shruthi XT.vst3" "dist/Shruthi XT.app"
          cp INSTALLIEREN.txt LICENSE dist/
          cd dist && zip -r -y ../ShruthiXT-macOS.zip .

      - name: Validate Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/Shruthi XT.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Shxt Shem

      - uses: actions/upload-artifact@v4
        with:
          name: ShruthiXT-macOS
          path: ShruthiXT-macOS.zip

      - name: Publish as release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ShruthiXT-macOS.zip --title "Shruthi XT – neuester Build" --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Installation: siehe INSTALLIEREN.txt im ZIP." --target "$GITHUB_SHA"
