# Builds the unsigned Fundstück iPhone app (incl. AUv3 plug-in) on a GitHub-hosted Mac.
# Result: Actions → this run → Artifacts → "Fundstueck-ipa". Install with Sideloadly.
name: Build Fundstück iPhone (IPA)

on:
  push:
    paths:
      - 'Fundstück iPhone/**'
      - '.github/workflows/build-fundstueck-iphone.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: "Fundstück iPhone"
    steps:
      - uses: actions/checkout@v4

      - name: DSP tests
        run: make -C Tests CC=clang

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Fundstueck.xcodeproj \
            -scheme Fundstueck \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -50; tail -30 build.log; exit 1; }
          test -d build/Build/Products/Release-iphoneos/Fundstueck.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Fundstueck.app Payload/
          ls Payload/Fundstueck.app/PlugIns
          zip -qry Fundstueck.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Fundstueck-ipa
          path: "Fundstück iPhone/Fundstueck.ipa"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fundstueck-build-log
          path: "Fundstück iPhone/build.log"
