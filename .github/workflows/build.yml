name: Build macOS (MIKROKORN)

on:
  push:
    branches: [mikrokorn]
    tags: ["mikrokorn-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Werks-Samples und Presets erzeugen
        run: node tools/gen_assets.js

      - name: Configure (universal arm64 + x86_64)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DMIKROKORN_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4 --target Mikrokorn_VST3 Mikrokorn_AU Mikrokorn_Standalone mikrokorn_smoke

      - name: Smoke-Test (alle 250 Presets, State, eigene Presets)
        run: ./build/mikrokorn_smoke

      - name: Artefakte finden + ad-hoc signieren
        run: |
          set -euo pipefail
          VST3=$(find build -name "MIKROKORN.vst3" -type d -path "*VST3*" | head -1)
          AU=$(find build -name "MIKROKORN.component" -type d | head -1)
          APP=$(find build -name "MIKROKORN.app" -type d | head -1)
          echo "VST3=$VST3" >> $GITHUB_ENV; echo "AU=$AU" >> $GITHUB_ENV; echo "APP=$APP" >> $GITHUB_ENV
          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AU"
          codesign --force --deep --sign - "$APP"
          lipo -info "$VST3/Contents/MacOS/MIKROKORN"

      - name: Validate (pluginval + auval)
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 6 --validate-in-process \
              --timeout-ms 300000 "$VST3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumu Mkrn Dkbm

      - name: Package (.pkg installer + .zip)
        run: |
          set -euo pipefail
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # .pkg: installiert nach /Library/Audio/Plug-Ins (keine Quarantäne-Probleme)
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 pkgroot/Library/Audio/Plug-Ins/Components
          cp -R "$VST3" pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R "$AU" pkgroot/Library/Audio/Plug-Ins/Components/
          pkgbuild --analyze --root pkgroot components.plist
          i=0
          while /usr/libexec/PlistBuddy -c "Print :$i" components.plist >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" components.plist || true
            i=$((i+1))
          done
          pkgbuild --root pkgroot --component-plist components.plist \
                   --identifier com.donkirschbaum.mikrokorn.pkg --version "$VERSION" \
                   --install-location / --scripts packaging/scripts \
                   "MIKROKORN-$VERSION-macOS-Installer.pkg"

          # .zip: VST3 + AU + Standalone-App zum manuellen Installieren
          D="dist/MIKROKORN-$VERSION-macOS"
          mkdir -p "$D"
          cp -R "$VST3" "$AU" "$APP" "$D/"
          cp docs/INSTALL.txt "$D/LIESMICH.txt"
          (cd dist && ditto -c -k --keepParent "MIKROKORN-$VERSION-macOS" "../MIKROKORN-$VERSION-macOS.zip")
          ls -la *.pkg *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MIKROKORN-macOS
          path: |
            MIKROKORN-*-macOS-Installer.pkg
            MIKROKORN-*-macOS.zip

      - name: Publish release
        if: github.ref == 'refs/heads/mikrokorn' || startsWith(github.ref, 'refs/tags/mikrokorn-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mikrokorn-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MIKROKORN v${{ env.VERSION }}
          make_latest: false
          body_path: docs/RELEASE_NOTES.md
          files: |
            MIKROKORN-*-macOS-Installer.pkg
            MIKROKORN-*-macOS.zip
