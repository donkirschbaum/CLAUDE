name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Universal VST3 + AU + Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target ShakerLab_VST3 ShakerLab_AU ShakerLab_Standalone -- -quiet

      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/ShakerLab_artefacts/Release/AU/Shaker Lab.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Shk4 Dkrs || (echo "auval failed" && exit 1)

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process \
            --skip-gui-tests "build/ShakerLab_artefacts/Release/VST3/Shaker Lab.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/ShakerLab_artefacts/Release/VST3/Shaker Lab.vst3" dist/
          cp -R "build/ShakerLab_artefacts/Release/AU/Shaker Lab.component" dist/
          cp -R "build/ShakerLab_artefacts/Release/Standalone/Shaker Lab.app" dist/
          # Ad-hoc-Signatur, damit die Bundles auf Apple Silicon laden
          codesign --force --deep --sign - "dist/Shaker Lab.vst3" "dist/Shaker Lab.component" "dist/Shaker Lab.app"
          cp tools/Installieren.command dist/
          chmod +x "dist/Installieren.command"
          cp README.md dist/
          cd dist && zip -qry ../ShakerLab-macOS.zip .

      - uses: actions/upload-artifact@v5
        with:
          name: ShakerLab-macOS
          path: ShakerLab-macOS.zip

      - name: Publish GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "${TAG}" ShakerLab-macOS.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --latest \
            --title "Shaker Lab ${TAG}" \
            --notes "Fertiges Plugin für macOS (Universal: Apple Silicon + Intel): VST3, AU und Standalone-App. ZIP entpacken, Installieren.command per Rechtsklick → Öffnen starten, Ableton neu starten. Details im README."

  linux:
    name: Linux (VST3 + Engine-Test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ShakerLab_VST3 shaker_render_test -j4
      - name: Engine-Test
        run: |
          mkdir -p out
          ./build/shaker_render_test_artefacts/Release/shaker_render_test out
